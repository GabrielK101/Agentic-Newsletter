# Copy this file to config.yaml and edit freely. config.yaml is gitignored;
# this file is the committed template.

# How far back to search for new stories.
lookback_days: 3

# How far back to look when checking for stories already told, to avoid repeats.
history_days: 7

# commentary: none | context | analysis
#   none     - no additions beyond what the sources state
#   context  - brief background is allowed
#   analysis - reasoned interpretation is allowed, still grounded in sources
topics:
  - name: Example topic
    focus: >
      Replace this with what you actually want covered for this topic: the
      angle, the level of depth, and what to skip.
    commentary: none

sites:
  - https://example.com

# Copy this file to config.yaml and edit freely. config.yaml is gitignored;
# this file is the committed template.

# How far back to search for new stories.
lookback_days: 3

# How far back to look when checking for stories already told, to avoid repeats.
history_days: 7

# commentary: none | context | analysis
#   none     - no additions beyond what the sources state
#   context  - brief background is allowed
#   analysis - reasoned interpretation is allowed, still grounded in sources
topics:
  - name: Example topic
    focus: >
      Replace this with what you actually want covered for this topic: the
      angle, the level of depth, and what to skip.
    commentary: none

sites:
  - https://example.com

# Masthead title and optional tagline (shown in italic under the title).
title: The Daily Digest
tagline: Replace with your own tagline, or remove this line

# Fetch an article image for each story (hotlinked from the publisher - see
# the README note on what that reveals to them). Set to false to turn it off.
images: true

# Who the email goes to. Optional - falls back to env DIGEST_TO if unset.
# recipient: you@example.com

# Always include general news (top global stories, plus a couple of
# interesting/unexpected ones) alongside your topics. Set to false to
# cover only the topics above.
general_news: true
# general_focus: the biggest global stories of the day, plus one or two genuinely interesting or unexpected stories

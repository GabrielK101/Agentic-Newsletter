# Committed production config - baked into the Docker image. Nothing
# secret lives here: no keys, no email addresses. Select it at runtime
# with DIGEST_CONFIG=config.prod.yaml (the Dockerfile sets this).

# How far back to search for new stories.
lookback_days: 3

# How far back to look when checking for stories already told, to avoid repeats.
history_days: 7

# commentary: none | context | analysis
#   none     - no additions beyond what the sources state
#   context  - brief background is allowed
#   analysis - reasoned interpretation is allowed, still grounded in sources
topics:
  - name: Formula 1
    focus: >
      Enthusiast depth. Open with one state-of-the-season line, then specific
      recent events: race results and incidents, technical and regulation
      news, driver and team moves. Skip betting, previews and fluff.
    commentary: none
  - name: Big tech
    focus: >
      Skim depth. Major business moves, product launches, and policy or
      legal news involving large tech companies and AI. Skip reviews, deals
      and lifestyle pieces.
    commentary: none
  - name: Finance
    focus: >
      Only what moved or will move markets: central banks, major earnings,
      big deals, macro data. If markets are closed, cover the last close and
      what is scheduled next. Skip personal-finance tips, trading commentary
      and video.
    commentary: none

sites:
  - https://www.wired.com
  - https://arstechnica.com

# Masthead title and optional tagline (shown in italic under the title).
title: The Daily Digest
tagline: Your personalised morning briefing

# Fetch an article image for each story (hotlinked from the publisher - see
# the README note on what that reveals to them). Set to false to turn it off.
images: true

# No recipient here on purpose - set DIGEST_TO as a real secret/env var at
# deploy time, not baked into the image.
